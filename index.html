<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check-in | 打卡系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --primary-color: #7d6e63;
      --primary-hover: #63564d;
      --text-main: #4a403a;
      --text-muted: #9e938a;
      --border-color: #eae5df;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      --radius: 16px;
      --tag-work-bg: #e8f3ec;
      --tag-work-text: #3d7a5a;
      --tag-off-bg: #fbeee9;
      --tag-off-text: #b56247;
      --tag-book-bg: #eee8ff;
      --tag-book-text: #6650a4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans TC', sans-serif; word-break: break-word; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      border: 1px solid var(--border-color);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; font-weight: 500; color: var(--primary-color); margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }

    .nav-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
    .tab-btn {
      flex: 1; padding: 12px 0; background: none; border: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 500; cursor: pointer; position: relative; transition: color 0.2s;
    }
    .tab-btn span.en { display: block; font-size: 0.7rem; font-weight: 400; opacity: 0.8; }
    .tab-btn.active { color: var(--primary-color); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: var(--primary-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; min-width: 0; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; min-width: 0; }

    label { display: block; font-size: 0.85rem; color: var(--primary-color); margin-bottom: 6px; font-weight: 500; }
    label .en { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: 4px; }

    input, select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px;
      background-color: #faf9f7; color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary-color); background-color: #ffffff; }
    select:disabled, input:disabled { background-color: #f0ede6; cursor: not-allowed; opacity: 0.8; }

    .current-datetime-display {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 4px 0 2px;
      text-align: left;
    }
    .current-date-display {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary-color);
    }
    .current-time-display {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary-color);
    }

    .type-toggle-group { display: flex; gap: 10px; }
    .type-btn {
      flex: 1; padding: 10px 8px; border: 1px solid var(--border-color); background-color: #faf9f7;
      color: var(--text-muted); border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: center;
    }
    .type-btn .en { display: block; font-size: 0.75rem; font-weight: 400; }
    .type-btn.active[data-type="上班"] { background-color: var(--tag-work-bg); color: var(--tag-work-text); border-color: var(--tag-work-text); }
    .type-btn.active[data-type="下班"] { background-color: var(--tag-off-bg); color: var(--tag-off-text); border-color: var(--tag-off-text); }

    .btn-submit {
      width: 100%; padding: 12px; background-color: var(--primary-color); color: #ffffff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background 0.2s;
    }
    .btn-submit .en { display: block; font-size: 0.8rem; opacity: 0.85; }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; opacity: 0.7; }

    .contact-notice { background-color: #f2efe9; color: var(--primary-color); font-size: 0.8rem; text-align: center; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); }

    .filter-group { display: flex; gap: 4px; margin-bottom: 16px; }
    .filter-btn {
      flex: 1; padding: 6px 2px; background-color: #faf9f7; border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; text-align: center;
    }
    .filter-btn .en { display: block; font-size: 0.68rem; opacity: 0.85; }
    .filter-btn.active { background-color: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }

    .status-view {
      display: none;
      background-color: #faf9f7;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px 18px;
      text-align: center;
      min-height: 180px;
    }

    .status-view.show { display: block; }

    .status-view-title {
      color: var(--primary-color);
      font-size: 0.9rem;
      margin-bottom: 14px;
      font-weight: 600;
    }

    .status-view-name {
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .latest-status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid var(--border-color);
      background: #ffffff;
    }

    .latest-status-badge.booked {
      color: #7b6b5f;
      background: #f7f3ef;
      border: 1px solid #b9aaa0;
    }

    .latest-status-badge.working {
      background: var(--tag-work-bg);
      color: var(--tag-work-text);
      border-color: var(--tag-work-text);
    }

    .latest-status-badge.pending {
      background: #fff7e8;
      color: #b7791f;
      border-color: #e8c77b;
    }

    .latest-status-badge.off {
      background: var(--tag-off-bg);
      color: var(--tag-off-text);
      border-color: var(--tag-off-text);
    }

    .latest-status-badge.manual {
      background: #f0fdf4;
      color: #16a34a;
      border-color: #4ade80;
    }

    .latest-status-time {
      margin-top: 12px;
      color: var(--text-muted);
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .latest-status-empty {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 20px 0;
    }


    .calc-panel { background-color: #f5f2ec; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .calc-panel h3 { font-size: 0.95rem; color: var(--primary-color); margin-bottom: 12px; font-weight: 600; }
    .calc-panel input { padding: 8px 6px; font-size: 0.8rem; background-color: #ffffff; }
    .rule-tip {
      margin-top: 4px;
      font-size: 0.72rem;
      color: #a58f80;
      line-height: 1.5;
    }
    .result-box { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .result-box strong { font-size: 1.35rem; color: #3d7a5a; }

    .record-list { list-style: none; max-height: 280px; overflow-y: auto; }
    .record-item {
      padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px;
      background-color: #faf9f7; display: flex; justify-content: space-between; align-items: center;
    }
    .record-info { font-size: 0.85rem; line-height: 1.5; flex-grow: 1; }
    .record-info strong { color: var(--primary-color); font-weight: 500; }

    .action-btns { display: flex; gap: 4px; align-items: center; }
    .btn-action-icon { background: none; border: 1px solid var(--border-color); background-color: #ffffff; font-size: 0.8rem; padding: 4px 8px; cursor: pointer; border-radius: 6px; color: var(--primary-color); font-weight: 500; }
    .btn-action-icon:hover { background-color: var(--border-color); }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; margin-left: 6px; }
    .tag-上班 { background-color: var(--tag-work-bg); color: var(--tag-work-text); }
    .tag-下班 { background-color: var(--tag-off-bg); color: var(--tag-off-text); }
    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px 0; }

    .status-panel { background-color: #faf9f7; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    .status-toggle-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color); }
    .switch-btn-group { display: flex; gap: 6px; }
    .sw-btn { padding: 8px 14px; border: 1px solid var(--border-color); background-color: #ffffff; color: var(--text-muted); border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .sw-btn.active-on { background-color: var(--tag-work-bg); color: var(--tag-work-text); border-color: var(--tag-work-text); }
    .sw-btn.active-off { background-color: var(--tag-off-bg); color: var(--tag-off-text); border-color: var(--tag-off-text); }
    .sw-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: rgba(74, 64, 58, 0.9);
      color: #ffffff; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000;
    }
    .toast.show { opacity: 1; }
  
    /* 狀態模式顏色區分 */
    #statusSelect option[value="只嗨 (High Only)"] {
      color: #d97706;
      font-weight: 600;
    }
    #statusSelect option[value="只酒 (Drinks Only)"] {
      color: #2563eb;
      font-weight: 600;
    }
    #statusSelect option[value="都可以 (Both)"] {
      color: #16a34a;
      font-weight: 600;
    }

    .status-high { color:#d97706 !important; font-weight:600; }
    .status-drinks { color:#2563eb !important; font-weight:600; }
    .status-both { color:#16a34a !important; font-weight:600; }

    /* 前台狀態模式：只有三種可自行選擇 */
    .status-mode-high {
      color: #d97706 !important;
      font-weight: 600;
      background-color: #fff7ed !important;
      border-color: #f59e0b !important;
    }
    .status-mode-drinks {
      color: #2563eb !important;
      font-weight: 600;
      background-color: #eff6ff !important;
      border-color: #60a5fa !important;
    }
    .status-mode-both {
      color: #16a34a !important;
      font-weight: 600;
      background-color: #f0fdf4 !important;
      border-color: #4ade80 !important;
    }

    /* 側邊計算機 */
    .calculator-fab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1998;
      border: 1px solid var(--border-color);
      border-right: none;
      background: #ffffff;
      color: var(--primary-color);
      border-radius: 12px 0 0 12px;
      padding: 12px 9px;
      min-width: 46px;
      box-shadow: 0 6px 18px rgba(0,0,0,.10);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.2;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transition: .2s ease;
    }

    .calculator-fab:hover {
      background: #faf9f7;
      padding-right: 12px;
    }

    .calculator-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1999;
      background: rgba(0,0,0,.18);
    }

    .calculator-overlay.show {
      display: block;
    }

    .calculator-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: min(410px, 92vw);
      height: 100vh;
      z-index: 2000;
      background: #ffffff;
      box-shadow: -10px 0 30px rgba(0,0,0,.12);
      border-left: 1px solid var(--border-color);
      transform: translateX(105%);
      transition: transform .25s ease;
      overflow-y: auto;
      padding: 24px 20px;
    }

    .calculator-sidebar.show {
      transform: translateX(0);
    }

    .calculator-sidebar .calc-panel {
      margin: 0;
      background: #f5f2ec;
      padding: 18px;
    }


    .calc-time-selects {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .calc-time-selects select {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 8px;
      border: 1px solid #ddd6cf;
      border-radius: 8px;
      background: #fff;
      color: #4f4842;
      font-size: 0.95rem;
      outline: none;
      cursor: pointer;
    }

    .calc-time-selects select:focus {
      border-color: #8b7a6d;
    }

    .calc-time-colon {
      font-weight: 600;
      color: #8b7a6d;
    }

    .calc-sidebar-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .calc-sidebar-title h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--primary-color);
      font-weight: 600;
    }

    .fare-tip {
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #a58f80;
      line-height: 1.3;
      white-space: nowrap;
    }

    .calc-sidebar-title h3 .en {
      font-size: .72rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .calc-close-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #fff;
      color: var(--primary-color);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
    }

    .calc-close-btn:hover {
      background: #faf9f7;
    }

    .calc-sidebar-note {
      margin: 0 0 14px;
      padding: 9px 11px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #faf9f7;
      color: var(--text-muted);
      font-size: .76rem;
      line-height: 1.5;
    }

    
        /* 計算機手機版：日期與時間欄位上下排列，避免重疊 */
        .calculator-sidebar .form-row {
          display: block;
        }
        .calculator-sidebar .form-row .form-group {
          width: 100%;
        }
        .calculator-sidebar .calc-time-selects {
          display: flex;
          width: 100%;
        }
        .calculator-sidebar .calc-time-selects select {
          min-width: 0;
          width: 100%;
        }

@media (max-width: 520px) {
      .calculator-fab {
        padding: 10px 8px;
        min-width: 42px;
        font-size: .76rem;
      }

      .calculator-sidebar {
        width: 94vw;
        padding: 18px 14px;
      }

      .calculator-sidebar .form-row {
        gap: 8px;
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>DAILY CHECK-IN</h1>
      <p>打卡系統 <span style="font-size: 0.8rem; opacity: 0.8;">/ Attendance System</span></p>
    </div>

    <div class="nav-tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('checkin')">新增打卡<span class="en">New Check-in</span></button>
      <button type="button" class="tab-btn" onclick="switchTab('records')">打卡紀錄<span class="en">Records</span></button>
      <button type="button" class="tab-btn" onclick="switchTab('status')">狀態提交<span class="en">Status</span></button>
    </div>

    <div id="checkinTab" class="tab-content active">
      <form id="checkinForm">
        <div class="form-group">
          <label for="userName">姓名 <span class="en">Name</span> *</label>
          <input type="text" id="userName" placeholder="請輸入姓名" required oninput="handleNameInput(this.value)">
        </div>

        <div class="form-group">
          <label>目前時間 <span class="en">Current Time</span></label>
          <div class="current-datetime-display">
            <span class="current-date-display" id="currentDateDisplay"></span>
            <span class="current-time-display" id="currentTimeDisplay">--:--</span>
          </div>
        </div>

        <div class="form-group">
          <label>打卡類別 <span class="en">Category</span> *</label>
          <div class="type-toggle-group">
            <button type="button" class="type-btn active" data-type="上班" onclick="selectType('上班')">上班<span class="en">Check-in</span></button>
            <button type="button" class="type-btn" data-type="下班" onclick="selectType('下班')">下班<span class="en">Check-out</span></button>
          </div>
        </div>

        <div class="form-group">
          <label for="location">地點 <span class="en">Location</span> *</label>
          <input type="text" id="location" placeholder="OW、八度、飛龍" required>
        </div>

        <div id="offWorkFields" style="display: none;">
          <div class="form-group">
            <label for="note">上下班備註 <span class="en">Attendance Note</span></label>
            <input type="text" id="note" placeholder="自收、客人算xx小、未收車資">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          完成打卡
          <span class="en">Submit Check-in</span>
        </button>
      </form>
    </div>

    <div id="recordsTab" class="tab-content">
      <div class="contact-notice">💡 若要修改請與管理者聯繫</div>

      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('daily', this)">每日<span class="en">Daily</span></button>
        <button class="filter-btn" onclick="setFilter('weekly', this)">本週<span class="en">Weekly</span></button>
        <button class="filter-btn" onclick="setFilter('thisMonth', this)">本月<span class="en">This Month</span></button>
        <button type="button" class="filter-btn" id="statusViewBtn" onclick="showLatestStatus(this)">狀態<span class="en">Status</span></button>
      </div>

      <ul id="recordList" class="record-list"></ul>

      <div id="latestStatusView" class="status-view">
        <div class="status-view-title">最近一筆狀態 / Latest Status</div>
        <div id="latestStatusContent"></div>
      </div>
    </div>

    <div id="statusTab" class="tab-content">
      <div class="status-panel">
        <div class="form-group">
          <label for="statusUserName">姓名 <span class="en">Name</span> *</label>
          <input type="text" id="statusUserName" placeholder="請輸入姓名" oninput="handleNameInput(this.value)">
        </div>

        <div class="status-toggle-box">
          <label>狀態開關 <span class="en">Status Switch</span></label>
          <div class="switch-btn-group" id="switchBtnGroup">
            <button type="button" id="swOnBtn" class="sw-btn active-on" onclick="setManualStatusState('ON')">ON</button>
            <button type="button" id="swOffBtn" class="sw-btn" onclick="setManualStatusState('OFF')">OFF</button>
          </div>
        </div>

        <div id="statusSelectGroup" class="form-group">
          <label for="statusSelect">狀態模式 <span class="en">Select Mode</span></label>
          <select id="statusSelect" onchange="handleStatusSelectChange(this.value)">
            <option value="" disabled selected>請選擇模式</option>
            <option value="🥳 只嗨 (High Only)">🥳 只嗨 (High Only)</option>
            <option value="🍷 只酒 (Drinks Only)">🍷 只酒 (Drinks Only)</option>
            <option value="🎉 都可以 (Both)">🎉 都可以 (Both)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="statusNote">狀態提交備註 <span class="en">Status Note</span></label>
          <input type="text" id="statusNote" placeholder="請輸入狀態提交備註">
        </div>

        <button type="button" id="statusSubmitBtn" class="btn-submit" style="margin-top: 16px;" onclick="submitStatusForm()">
          確認送出狀態
          <span class="en">Submit Status</span>
        </button>
      </div>
    </div>
  </div>

  <div id="noteEditModal" style="
    display:none; position:fixed; inset:0; z-index:2000;
    background:rgba(0,0,0,.28); align-items:center; justify-content:center;
    padding:20px;">
    <div style="
      width:100%; max-width:360px; background:#fff; border:1px solid var(--border-color);
      border-radius:12px; padding:20px; box-shadow:0 12px 30px rgba(0,0,0,.15);">
      <div style="font-size:1rem; font-weight:600; color:var(--primary-color); margin-bottom:12px;">
        ✏️ 編輯備註
      </div>
      <input type="text" id="editNoteInput" placeholder="請輸入備註"
        style="width:100%; margin-bottom:14px;">
      <div style="display:flex; gap:8px;">
        <button type="button" id="cancelEditNoteBtn" class="btn-action-icon" style="flex:1;">
          取消
        </button>
        <button type="button" id="saveEditNoteBtn" class="btn-submit" style="flex:1; margin-top:0;">
          儲存
        </button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwEJG79ivxM0CrOiRegiZl_qI4Pxf_9BJKxCKyyAYcDc9bq3A3joFrfSiL7ABpq25so/exec';

    let selectedType = '上班';
    let currentFilter = 'daily';
    let currentStatusState = 'ON';
    let latestStatusViewActive = false;
    let cloudRecords = [];
    let autoOffTimer = null;
    let bookedStatusLocked = false;
    // 下班成功後先暫存本地紀錄，避免雲端資料尚未刷新時被誤判成「仍在上班」。
    let optimisticAttendanceRecords = [];

    function initSavedUserName() {
      const savedName = localStorage.getItem('checkin_username') || '';
      if (savedName) {
        document.getElementById('userName').value = savedName;
        document.getElementById('statusUserName').value = savedName;
      }
    }

    function handleNameInput(value) {
      const trimmed = value.trim();
      if (trimmed) {
        localStorage.setItem('checkin_username', trimmed);
      } else {
        localStorage.removeItem('checkin_username');
      }
      
      const userNameEl = document.getElementById('userName');
      const statusUserNameEl = document.getElementById('statusUserName');
      if (userNameEl.value !== trimmed) userNameEl.value = trimmed;
      if (statusUserNameEl.value !== trimmed) statusUserNameEl.value = trimmed;

      // 重新抓取最新後台狀態，避免後台剛改成「已預約」但前台仍使用舊資料。
      fetchCloudData().finally(() => {
        checkUserWorkingStatus();
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
      }
      return str.split('T')[0].split(' ')[0];
    }

    function formatTime(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
      }
      return str.length > 5 ? str.substring(0, 5) : str;
    }


    function getTaipeiNow() {
      return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
    }

    function getTaipeiDateStr() {
      const d = getTaipeiNow();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getTaipeiTimeStr() {
      const d = getTaipeiNow();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function initCalcDates() {
      // 日期、時間、金額全部保持空白／0，不自動帶入今天或其他數值。
      document.getElementById('calcStartDate').value = '';
      document.getElementById('calcEndDate').value = '';

      document.getElementById('calcStartHour').value = '';
      document.getElementById('calcStartMinute').value = '';
      document.getElementById('calcEndHour').value = '';
      document.getElementById('calcEndMinute').value = '';

      document.getElementById('calcRate').value = '';
      document.getElementById('calcFare').value = '0';
      document.getElementById('calculatedHoursText').textContent = '0';
      document.getElementById('calcResult').textContent = '$0';
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      if (tabName === 'checkin') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('checkinTab').classList.add('active');
      } else if (tabName === 'records') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('recordsTab').classList.add('active');
        latestStatusViewActive = false;
        document.getElementById('recordList').style.display = 'block';
        document.getElementById('latestStatusView').classList.remove('show');
        document.querySelectorAll('#recordsTab .filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('#recordsTab .filter-btn').classList.add('active');
        fetchCloudData();
      } else if (tabName === 'status') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('statusTab').classList.add('active');
        fetchCloudData();
      }
    }

    function setCurrentTimeDisplay() {
      const now = new Date();
      const dateEl = document.getElementById('currentDateDisplay');
      const timeEl = document.getElementById('currentTimeDisplay');

      if (dateEl) {
        dateEl.textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      }
      if (timeEl) {
        const hh = String(now.getHours()).padStart(2, '0');
        const mi = String(now.getMinutes()).padStart(2, '0');
        timeEl.textContent = `${hh}:${mi}`;
      }
    }

    function selectType(type) {
      selectedType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        if (btn.getAttribute('data-type') === type) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      document.getElementById('offWorkFields').style.display = (type === '下班') ? 'block' : 'none';
      if (type !== '下班') document.getElementById('note').value = '';
      checkUserWorkingStatus();
    }

    function isUserBooked(name) {
      const trimmedName = String(name || '').trim().toLowerCase();
      if (!trimmedName) { bookedStatusLocked = false; return false; }

      const userStatusRecords = cloudRecords
        .filter(r =>
          String(r.name || '').trim().toLowerCase() === trimmedName &&
          r.type === '狀態'
        )
        .sort((a, b) => b.rowIndex - a.rowIndex);

      if (!userStatusRecords.length) { bookedStatusLocked = false; return false; }

      const latestStatus = userStatusRecords[0];
      const mode = String(latestStatus.statusMode || '').trim();

      bookedStatusLocked = (
        mode === '📅 已預約' ||
        mode === '已預約' ||
        mode === 'BOOK'
      );

      return bookedStatusLocked;
    }

    function getLatestStatusMode(name) {
      const trimmedName = String(name || '').trim().toLowerCase();
      if (!trimmedName) return '';

      const records = cloudRecords
        .filter(r =>
          String(r.name || '').trim().toLowerCase() === trimmedName &&
          r.type === '狀態'
        )
        .sort((a, b) => b.rowIndex - a.rowIndex);

      if (!records.length) return '';
      return String(records[0].statusMode || '').trim();
    }

    function isPendingAfterCheckout(name) {
      const mode = getLatestStatusMode(name);
      return (
        mode === '🌙 剛下班待確認' ||
        mode === '剛下班待確認' ||
        mode === '⏳ 待確認 (Pending)' ||
        mode === '待確認' ||
        mode === 'Pending'
      );
    }

    function isUserCurrentlyWorking(name) {
      const trimmedName = String(name || '').trim().toLowerCase();
      if (!trimmedName) return false;

      const attendanceRecords = cloudRecords
        .filter(r =>
          String(r.name || '').trim().toLowerCase() === trimmedName &&
          (r.type === '上班' || r.type === '下班')
        )
        .sort((a, b) => b.rowIndex - a.rowIndex);

      return attendanceRecords.length > 0 && attendanceRecords[0].type === '上班';
    }

    function showBookedStatusLocked() {
      // 「已預約」不再鎖定狀態提交。
      // 只有「上班中」才會鎖定狀態不可發送。
      const statusSelect = document.getElementById('statusSelect');
      const statusSubmitBtn = document.getElementById('statusSubmitBtn');
      const swOnBtn = document.getElementById('swOnBtn');
      const swOffBtn = document.getElementById('swOffBtn');
      const selectGroup = document.getElementById('statusSelectGroup');

      if (statusSelect) {
        statusSelect.disabled = false;
        statusSelect.style.opacity = '1';
        statusSelect.style.pointerEvents = 'auto';
      }

      if (swOnBtn) {
        swOnBtn.disabled = false;
        swOnBtn.style.opacity = '1';
        swOnBtn.style.pointerEvents = 'auto';
      }

      if (swOffBtn) {
        swOffBtn.disabled = false;
        swOffBtn.style.opacity = '1';
        swOffBtn.style.pointerEvents = 'auto';
      }

      if (statusSubmitBtn) {
        statusSubmitBtn.disabled = false;
        statusSubmitBtn.innerText = '確認送出狀態';
        statusSubmitBtn.style.opacity = '1';
        statusSubmitBtn.style.cursor = 'pointer';
      }

      if (selectGroup) {
        selectGroup.style.opacity = '1';
        selectGroup.style.pointerEvents = 'auto';
      }
    }

    function checkUserWorkingStatus() {
      const name = document.getElementById('userName').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const statusSelect = document.getElementById('statusSelect');
      const swOnBtn = document.getElementById('swOnBtn');
      const swOffBtn = document.getElementById('swOffBtn');
      const statusSubmitBtn = document.getElementById('statusSubmitBtn');
      
      if (!name) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
        if (statusSelect) statusSelect.disabled = false;
        if (swOnBtn) swOnBtn.disabled = false;
        if (swOffBtn) swOffBtn.disabled = false;
        if (statusSubmitBtn) {
          statusSubmitBtn.disabled = false;
          statusSubmitBtn.innerHTML = '確認送出狀態<span class="en">Submit Status</span>';
        }
        updateSwitchButtonStyles();
        return;
      }

      const userRecords = cloudRecords.filter(r =>
        r.name.toLowerCase() === name.toLowerCase() &&
        (r.type === '上班' || r.type === '下班')
      );

      if (userRecords.length > 0) {
        userRecords.sort((a, b) => b.rowIndex - a.rowIndex);
        const lastRecord = userRecords[0];

        const isWorking = lastRecord.type === '上班';

        if (isWorking) {
          if (selectedType === '上班') {
            submitBtn.disabled = true;
            submitBtn.innerText = '尚未打下班卡 (已鎖定)';
          } else {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
          }

          if (statusSelect) {
            showWorkingStatusLocked();
          }
          if (swOnBtn) swOnBtn.disabled = true;
          if (swOffBtn) swOffBtn.disabled = true;
          if (statusSubmitBtn) {
            statusSubmitBtn.disabled = true;
            statusSubmitBtn.innerText = '上班中已鎖定 (不可發送)';
          }
          currentStatusState = 'ON';
          updateSwitchButtonStyles();
          return;
        }
      }

      // 「已預約」只鎖定狀態提交，不影響正常上下班打卡。
      // 如果上一筆是下班，下一次仍可正常打上班卡。
      if (isUserBooked(name)) {
        showBookedStatusLocked();
        submitBtn.disabled = false;
        submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
        return;
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
      hideWorkingStatusLocked();
      if (swOnBtn) swOnBtn.disabled = false;
      if (swOffBtn) swOffBtn.disabled = false;
      if (statusSubmitBtn) {
        statusSubmitBtn.disabled = false;
        statusSubmitBtn.innerHTML = '確認送出狀態<span class="en">Submit Status</span>';
      }
      updateSwitchButtonStyles();
    }

    function fetchCloudData() {
      return fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          if (res.result === 'success') {
            const serverRecords = res.data.map((row, idx) => ({
              rowIndex: idx + 2,
              name: String(row[0] || '').trim(),
              date: formatDate(row[1]),
              time: formatTime(row[2]),
              location: String(row[3] || '').trim(),
              type: String(row[4] || '').trim(),
              note: ['TRUE', 'FALSE', 'true', 'false'].includes(String(row[5] || '').trim()) ? '' : String(row[5] || '').trim(),
              statusIsOn: row[6] !== undefined ? (row[6] === true || row[6] === 'TRUE' || row[6] === 'true' || row[6] === 'ON' || row[6] === 'on' || row[6] === 1) : false,
              statusMode: String(row[7] || '').trim()
            }));

            // 記住目前雲端存在的 OFF，讓後台手動刪除後前台可以知道「OFF 被清除了」，
            // 並顯示「目前尚無狀態紀錄」，而不是回抓上一筆狀態。
            serverRecords.filter(r => {
              const mode = normalizeStatusMode(r.statusMode);
              return r.type === '狀態' && (mode === 'OFF' || String(r.statusIsOn).toLowerCase() === 'false');
            }).forEach(r => rememberOffStatus(r));

            // 雲端已經收到的暫存紀錄就移除；尚未同步完成的則暫時保留。
            optimisticAttendanceRecords = optimisticAttendanceRecords.filter(opt =>
              !serverRecords.some(server =>
                String(server.name).toLowerCase() === String(opt.name).toLowerCase() &&
                server.date === opt.date &&
                server.time === opt.time &&
                server.type === opt.type
              )
            );

            cloudRecords = [...serverRecords, ...optimisticAttendanceRecords];
            renderRecords();
            if (latestStatusViewActive) renderLatestStatus();
            checkUserWorkingStatus();
          }
        })
        .catch(() => {});
    }

    document.addEventListener('change', function(e) {
      if (e.target && e.target.id === 'statusSelect') {
        updateStatusSelectColor();
      }
    });

    function updateStatusSelectColor() {
      const select = document.getElementById('statusSelect');
      if (!select) return;

      select.classList.remove(
        'status-mode-high',
        'status-mode-drinks',
        'status-mode-both'
      );

      const value = select.value || '';
      if (value.includes('只嗨') || value.includes('High Only')) {
        select.classList.add('status-mode-high');
      } else if (value.includes('只酒') || value.includes('Drinks Only')) {
        select.classList.add('status-mode-drinks');
      } else if (value.includes('都可以') || value.includes('Both')) {
        select.classList.add('status-mode-both');
      }
    }

    function removePendingStatusOption() {
      const select = document.getElementById('statusSelect');
      if (!select) return;
      Array.from(select.options).forEach(option => {
        if ((option.value || '').includes('⏳ 待確認') || (option.textContent || '').includes('⏳ 待確認')) {
          option.remove();
        }
      });
    }

    function showWorkingStatusLocked() {
      const statusSelect = document.getElementById('statusSelect');
      if (!statusSelect) return;

      let workingOption = Array.from(statusSelect.options)
        .find(opt => opt.value === '上班中Working');

      if (!workingOption) {
        workingOption = document.createElement('option');
        workingOption.value = '上班中Working';
        workingOption.textContent = '上班中Working';
        workingOption.disabled = true;
        statusSelect.insertBefore(workingOption, statusSelect.firstChild);
      }

      workingOption.disabled = true;
      statusSelect.value = '上班中Working';
      statusSelect.disabled = true;
    }

    function hideWorkingStatusLocked() {
      const statusSelect = document.getElementById('statusSelect');
      if (!statusSelect) return;

      const workingOption = Array.from(statusSelect.options)
        .find(opt => opt.value === '上班中Working');

      if (workingOption) workingOption.remove();

      statusSelect.disabled = false;
      statusSelect.value = '';
    }

    function setManualStatusState(state) {
      const name = document.getElementById('statusUserName').value.trim() || document.getElementById('userName').value.trim();
      if (document.getElementById('statusSelect').disabled) {
        currentStatusState = 'ON';
        document.getElementById('statusSelect').value = '上班中Working';
        updateSwitchButtonStyles();
        return;
      }

      currentStatusState = state;
      if (state === 'OFF') {
        document.getElementById('statusSelect').value = '';
      }
      updateSwitchButtonStyles();
    }

      if (document.getElementById('statusSelect').disabled) {
        showWorkingStatusLocked();

    function updateSwitchButtonStyles() {
      const onBtn = document.getElementById('swOnBtn');
      const offBtn = document.getElementById('swOffBtn');
      const selectGroup = document.getElementById('statusSelectGroup');
      const statusSelect = document.getElementById('statusSelect');
      const statusSubmitBtn = document.getElementById('statusSubmitBtn');

      onBtn.className = 'sw-btn' + (currentStatusState === 'ON' ? ' active-on' : '');
      offBtn.className = 'sw-btn' + (currentStatusState === 'OFF' ? ' active-off' : '');

      const statusName =
        document.getElementById('statusUserName').value.trim() ||
        document.getElementById('userName').value.trim();

      if (statusSelect && statusSelect.disabled) {
        selectGroup.style.opacity = '0.7';
        selectGroup.style.pointerEvents = 'none';
        onBtn.style.opacity = '0.6';
        onBtn.style.pointerEvents = 'none';
        offBtn.style.opacity = '0.6';
        offBtn.style.pointerEvents = 'none';
        if (statusSubmitBtn) {
          statusSubmitBtn.disabled = true;
          statusSubmitBtn.style.opacity = '0.6';
          statusSubmitBtn.style.cursor = 'not-allowed';
        }
        return;
      } else {
        onBtn.style.opacity = '1';
        onBtn.style.pointerEvents = 'auto';
        offBtn.style.opacity = '1';
        offBtn.style.pointerEvents = 'auto';
        if (statusSubmitBtn && !statusSubmitBtn.innerText.includes('送出中')) {
          statusSubmitBtn.disabled = false;
          statusSubmitBtn.style.opacity = '1';
          statusSubmitBtn.style.cursor = 'pointer';
        }
      }

      if (currentStatusState === 'OFF') {
        selectGroup.style.opacity = '0.5';
        selectGroup.style.pointerEvents = 'none';
      } else {
        selectGroup.style.opacity = '1';
        selectGroup.style.pointerEvents = 'auto';
      }

    function submitStatusForm() {
      const name = document.getElementById('statusUserName').value.trim();
      if (!name) {
        alert('請先輸入姓名！');
        document.getElementById('statusUserName').focus();
        return;
      }

      // 後台為「📅 已預約」時，禁止前台提交任何狀態，
      // 包含 ON 與 OFF；只有打上班卡後才解除鎖定。
      const attendanceRecords = cloudRecords.filter(r =>
        r.name.toLowerCase() === name.toLowerCase() &&
        (r.type === '上班' || r.type === '下班')
      ).sort((a, b) => b.rowIndex - a.rowIndex);

      if (attendanceRecords.length > 0 && attendanceRecords[0].type === '上班') {
        const statusSelect = document.getElementById('statusSelect');
        const statusSubmitBtn = document.getElementById('statusSubmitBtn');
        const swOnBtn = document.getElementById('swOnBtn');
        const swOffBtn = document.getElementById('swOffBtn');

        showWorkingStatusLocked();
        swOnBtn.disabled = true;
        swOffBtn.disabled = true;
        statusSubmitBtn.disabled = true;
        statusSubmitBtn.innerText = '上班中已鎖定 (不可發送)';
        currentStatusState = 'ON';
        updateSwitchButtonStyles();

        alert('目前為上班中 Working，請先打下班卡後才能提交其他狀態。');
        return;
      }

      const statusIsOn = (currentStatusState === 'ON');
      const statusMode = statusIsOn ? document.getElementById('statusSelect').value : 'OFF';

      // 「待確認」只能由下班打卡系統自動設定，員工不能手動送出。
      if (String(statusMode || '').includes('待確認') || String(statusMode || '').includes('Pending')) {
        alert('「待確認」為系統自動狀態，無法手動送出。請選擇其他狀態。');
        return;
      }

      if (statusIsOn && !statusMode) {
        alert('開啟 ON 時請選擇狀態模式！');
        return;
      }

      clearPendingAutoOff();

      const currentTime = getTaipeiTimeStr();
      const todayStr = getTaipeiDateStr();
      const note = document.getElementById('statusNote').value.trim();

      const payload = {
        name,
        type: '狀態',
        date: todayStr,
        time: currentTime,
        location: '',
        note: note,
        statusIsOn: statusIsOn,
        statusMode: statusMode
      };

      const submitBtn = document.getElementById('statusSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '送出中...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          showToast('✅ 狀態送出成功！');
          document.getElementById('statusNote').value = '';

          fetchCloudData();
        } else {
          alert('送出失敗：' + (res.message || '未知錯誤'));
        }
      })
      .catch(() => {
        alert('送出失敗，請檢查網路連線。');
      })
      .finally(() => {
        const latestAttendance = cloudRecords
          .filter(r =>
            r.name.toLowerCase() === name.toLowerCase() &&
            (r.type === '上班' || r.type === '下班')
          )
          .sort((a, b) => b.rowIndex - a.rowIndex)[0];

        if (latestAttendance && latestAttendance.type === '上班') {
          submitBtn.disabled = true;
          submitBtn.innerText = '上班中上班中已鎖定 (不可發送)';
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '確認送出狀態<span class="en">Submit Status</span>';
        }
      });
    }

    function normalizeStatusMode(mode) {
      return String(mode || '').trim();
    }

    function isPendingStatus(mode) {
      const value = normalizeStatusMode(mode);
      return (
        value.includes('待確認') ||
        value.includes('Pending')
      );
    }

    function getLatestStatusRecordForUser(name) {
      const normalizedName = String(name || '').trim().toLowerCase();
      if (!normalizedName) return null;

      const userRecords = cloudRecords.filter(r =>
        String(r.name || '').trim().toLowerCase() === normalizedName
      );

      // 核心規則：
      // 1. 只要有「狀態」提交紀錄，就只從「狀態」紀錄取最後一筆。
      //    這樣「最近更新」會是提交狀態的時間，不會誤抓下班時間。
      // 2. 只有在完全沒有「狀態」紀錄時，才使用上班/下班紀錄
      //    的 statusMode 作為初始狀態 fallback。
      const statusCandidates = userRecords
        .filter(r => r.type === '狀態')
        .sort((a, b) => Number(b.rowIndex || 0) - Number(a.rowIndex || 0));

      if (statusCandidates.length) {
        return statusCandidates[0];
      }

      const attendanceCandidates = userRecords
        .filter(r =>
          (r.type === '上班' || r.type === '下班') &&
          String(r.statusMode || '').trim()
        )
        .sort((a, b) => Number(b.rowIndex || 0) - Number(a.rowIndex || 0));

      return attendanceCandidates.length ? attendanceCandidates[0] : null;
    }

    // OFF 狀態規則：
    // 1. OFF 送出後最多有效 1 小時，超過 1 小時前台顯示「目前尚無狀態紀錄」。
    // 2. 若後台在 1 小時內手動刪除 OFF，前台也顯示「目前尚無狀態紀錄」，不回抓上一筆狀態。
    // 3. 若之後重新提交新的狀態，則以新的狀態為準。
    function getStatusTimestamp(record) {
      if (!record) return 0;
      const date = String(record.date || '').trim();
      const time = String(record.time || '').trim();
      if (!date || !time) return 0;
      const d = new Date(`${date}T${time}:00+08:00`);
      const ts = d.getTime();
      return Number.isFinite(ts) ? ts : 0;
    }

    function rememberOffStatus(record) {
      if (!record || !record.name || !record.rowIndex) return;
      localStorage.setItem(`active_off_status_${String(record.name).trim().toLowerCase()}`, JSON.stringify({
        rowIndex: Number(record.rowIndex),
        date: String(record.date || '').trim(),
        time: String(record.time || '').trim(),
        timestamp: getStatusTimestamp(record)
      }));
    }

    function getRememberedOffStatus(name) {
      try {
        const raw = localStorage.getItem(`active_off_status_${String(name || '').trim().toLowerCase()}`);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    function clearRememberedOffStatus(name) {
      localStorage.removeItem(`active_off_status_${String(name || '').trim().toLowerCase()}`);
    }

    function resolveLatestStatusForUser(name) {
      const normalizedName = String(name || '').trim().toLowerCase();

      // 狀態紀錄與上下班打卡紀錄分開判斷。
      // 「上班」打卡一旦晚於最後一筆狀態提交，就代表目前正在上班，
      // 不能再被較早的「已預約／只嗨／只酒／都可以」覆蓋。
      const attendanceRecords = cloudRecords
        .filter(r =>
          String(r.name || '').trim().toLowerCase() === normalizedName &&
          (r.type === '上班' || r.type === '下班')
        )
        .sort((a, b) => Number(b.rowIndex || 0) - Number(a.rowIndex || 0));

      const statusRecords = cloudRecords
        .filter(r =>
          String(r.name || '').trim().toLowerCase() === normalizedName &&
          r.type === '狀態'
        )
        .sort((a, b) => Number(b.rowIndex || 0) - Number(a.rowIndex || 0));

      const latestAttendance = attendanceRecords[0] || null;
      const latestStatus = statusRecords[0] || null;

      const latestStatusMode = normalizeStatusMode(latestStatus?.statusMode);
      const latestIsOff = latestStatus && (
        latestStatusMode === 'OFF' ||
        String(latestStatus.statusIsOn).toLowerCase() === 'false'
      );
      const rememberedOff = getRememberedOffStatus(name);

      // ★ OFF 的判斷以「提交時間」為準，不使用 rowIndex。
      // Google Sheet 刪除一列後，後面的 rowIndex 會重新往前排列，
      // 因此不能用 rowIndex 判斷 OFF 是否被刪除。
      const rememberedOffTimestamp = rememberedOff
        ? Number(rememberedOff.timestamp || 0)
        : 0;
      const latestStatusTimestamp = latestStatus
        ? getStatusTimestamp(latestStatus)
        : 0;

      // 有新的非 OFF 狀態提交，而且提交時間晚於 OFF：
      // 代表使用者已重新設定新狀態，解除 OFF 的無狀態鎖定。
      if (latestStatus && !latestIsOff && rememberedOff &&
          latestStatusTimestamp > rememberedOffTimestamp) {
        clearRememberedOffStatus(name);
      }

      // ★ 前台曾經收到 OFF，但後台把這筆 OFF 手動刪除：
      // 如果目前最新狀態已經不是原本那筆 OFF，且時間早於 OFF，
      // 或雲端已經沒有任何狀態紀錄，直接顯示「目前尚無狀態紀錄」。
      // 絕對不回抓上一筆狀態。
      if (rememberedOff && !latestIsOff) {
        const offWasDeleted =
          !latestStatus ||
          (
            rememberedOffTimestamp > 0 &&
            latestStatusTimestamp > 0 &&
            latestStatusTimestamp < rememberedOffTimestamp
          );

        if (offWasDeleted) {
          clearRememberedOffStatus(name);
          return null;
        }
      }

      // OFF 超過 1 小時後，前台直接視為無狀態。
      // 不回抓上一筆狀態。
      if (latestIsOff) {
        rememberOffStatus(latestStatus);
        const offTimestamp = getStatusTimestamp(latestStatus);
        if (offTimestamp && (Date.now() - offTimestamp) >= 60 * 60 * 1000) {
          return null;
        }
      }

      // 最新一筆上下班紀錄是「上班」，且沒有更新的狀態提交：
      // 前台狀態直接顯示「上班中」。
      if (
        latestAttendance &&
        latestAttendance.type === '上班' &&
        (!latestStatus ||
         Number(latestAttendance.rowIndex || 0) > Number(latestStatus.rowIndex || 0))
      ) {
        return {
          mode: '上班中Working',
          className: 'working',
          date: latestAttendance.date,
          time: latestAttendance.time
        };
      }

      // 最新一筆是下班，且沒有更新的狀態提交：
      // 依現有規則顯示待確認。
      if (
        latestAttendance &&
        latestAttendance.type === '下班' &&
        (!latestStatus ||
         Number(latestAttendance.rowIndex || 0) > Number(latestStatus.rowIndex || 0))
      ) {
        return {
          mode: '⏳ 待確認 (Pending)',
          className: 'pending',
          date: latestAttendance.date,
          time: latestAttendance.time
        };
      }

      // 有較新的狀態提交時，以狀態提交為準。
      const latest = latestStatus;
      if (!latest) return null;

      const mode = normalizeStatusMode(latest.statusMode);

      if (isPendingStatus(mode)) {
        return {
          mode: '⏳ 待確認 (Pending)',
          className: 'pending',
          date: latest.date,
          time: latest.time
        };
      }

      if (mode === 'OFF' || String(latest.statusIsOn).toLowerCase() === 'false') {
        return {
          mode: 'OFF｜您已下線',
          className: 'off',
          date: latest.date,
          time: latest.time
        };
      }

      if (
        mode === 'BOOK' ||
        mode === '已預約' ||
        mode === '📅 已預約'
      ) {
        return {
          mode: '📅 已預約',
          className: 'booked',
          date: latest.date,
          time: latest.time
        };
      }

      if (mode === '上班中Working') {
        return {
          mode: '上班中Working',
          className: 'working',
          date: latest.date,
          time: latest.time
        };
      }

      if (mode) {
        return {
          mode,
          className: 'manual',
          date: latest.date,
          time: latest.time
        };
      }

      return {
        mode: latest.statusIsOn ? '上班中Working' : 'OFF｜您已下線',
        className: latest.statusIsOn ? 'working' : 'off',
        date: latest.date,
        time: latest.time
      };
    }

      fetchCloudData().then(() => {

    function filterRecords(records) {
      const now = new Date(), todayStr = getTodayStr();
      return records.filter(item => {
        if (item.type === '狀態') return false;
        const rDate = new Date(item.date.replace(/-/g, '/'));
        if (currentFilter === 'daily') return item.date === todayStr;
        if (currentFilter === 'weekly') {
          const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
          return rDate >= weekAgo && rDate <= now;
        }
        if (currentFilter === 'thisMonth') {
          return rDate.getFullYear() === now.getFullYear() &&
                 rDate.getMonth() === now.getMonth();
        }
        return true;
      });
    }

    function calculateCrossDayHours(sDate, sTime, eDate, eTime) {
      if (!sDate || !sTime || !eDate || !eTime) return 0;

      // 純手動計算：不讀取任何打卡資料。
      const startParts = sDate.split('-').map(Number);
      const startTimeParts = sTime.split(':').map(Number);
      const endParts = eDate.split('-').map(Number);
      const endTimeParts = eTime.split(':').map(Number);

      if (
        startParts.length !== 3 || startTimeParts.length < 2 ||
        endParts.length !== 3 || endTimeParts.length < 2 ||
        startParts.some(Number.isNaN) || startTimeParts.some(Number.isNaN) ||
        endParts.some(Number.isNaN) || endTimeParts.some(Number.isNaN)
      ) return 0;

      const start = new Date(
        startParts[0], startParts[1] - 1, startParts[2],
        startTimeParts[0], startTimeParts[1], 0, 0
      );
      const end = new Date(
        endParts[0], endParts[1] - 1, endParts[2],
        endTimeParts[0], endTimeParts[1], 0, 0
      );

      // 同一天若下班時間早於／等於上班時間，自動視為隔日下班。
      if (sDate === eDate && end.getTime() <= start.getTime()) {
        end.setDate(end.getDate() + 1);
      }

      const mins = Math.floor((end.getTime() - start.getTime()) / 60000);
      if (!Number.isFinite(mins) || mins <= 0) return 0;

      const full = Math.floor(mins / 60);
      const rem = mins % 60;

      // 0–14 分不計；15–44 分加 0.5 小時；45–59 分加 1 小時。
      return full + (rem >= 45 ? 1.0 : (rem >= 15 ? 0.5 : 0));
    }

    function getCalcTime(prefix) {
      const hour = document.getElementById(prefix + 'Hour')?.value || '';
      const minute = document.getElementById(prefix + 'Minute')?.value || '';
      if (!hour || !minute) return '';
      return `${hour}:${minute}`;
    }

    function setCalcTime(prefix, timeValue) {
      const match = String(timeValue || '00:00').match(/^(\d{1,2}):(\d{2})$/);
      const hour = match ? String(Math.min(23, Math.max(0, Number(match[1])))).padStart(2, '0') : '00';
      const minute = match ? String(Math.min(59, Math.max(0, Number(match[2])))).padStart(2, '0') : '00';

      const hourEl = document.getElementById(prefix + 'Hour');
      const minuteEl = document.getElementById(prefix + 'Minute');
      if (hourEl) hourEl.value = hour;
      if (minuteEl) minuteEl.value = minute;
    }

    function calculateTotalAmount() {
      const startDate = document.getElementById('calcStartDate').value;
      const endDate = document.getElementById('calcEndDate').value;
      const startTime = getCalcTime('calcStart');
      const endTime = getCalcTime('calcEnd');

      // 日期或時間尚未完整選擇時，不計算工時，總金額維持 0。
      if (!startDate || !endDate || !startTime || !endTime) {
        document.getElementById('calculatedHoursText').innerText = '0';
        document.getElementById('calcResult').innerText = '$0';
        return;
      }

      const hours = calculateCrossDayHours(
        startDate, startTime,
        endDate, endTime
      );

      const rate = parseFloat(document.getElementById('calcRate').value) || 0;
      const fare = parseFloat(document.getElementById('calcFare').value) || 0;

      document.getElementById('calculatedHoursText').innerText = hours;
      document.getElementById('calcResult').innerText =
        `$${Math.round((hours * rate) + fare).toLocaleString()}`;
    }

    function renderRecords() {
      const list = document.getElementById('recordList');
      const statusView = document.getElementById('latestStatusView');

      // 點選「狀態」後，只顯示最近一筆狀態卡片。
      // 雲端資料重新同步時也維持這個畫面，不讓打卡紀錄重新跑回來。
      if (latestStatusViewActive) {
        if (list) {
          list.innerHTML = '';
          list.style.display = 'none';
        }
        if (statusView) statusView.classList.add('show');
        renderLatestStatus();
        return;
      }

      list.innerHTML = '';
      list.style.display = 'block';
      if (statusView) statusView.classList.remove('show');

      const filtered = filterRecords(cloudRecords).reverse();
      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty-msg">尚無符合條件的紀錄</li>';
        return;
      }

      filtered.forEach(item => {
        const li = document.createElement('li');
        li.className = 'record-item';
        li.dataset.copyText = `${item.name} ${item.date} ${item.time} ${item.location} ${item.type}`;
        li.title = '點擊此筆紀錄即可複製';

        const safeNote = ['TRUE', 'FALSE', 'true', 'false'].includes(String(item.note).trim()) ? '' : String(item.note || '').trim();
        const noteStr = safeNote
          ? `<br><span style="color:#7d6e63; font-size:0.78rem;">📝 ${escapeHtml(safeNote)}</span>`
          : '<br><span style="color:#9e938a; font-size:0.78rem;">📝 尚無備註</span>';

        li.innerHTML = `
          <div class="record-info">
            <div><strong>${escapeHtml(item.name)}</strong> <span class="tag tag-${escapeHtml(item.type)}">${escapeHtml(item.type)}</span></div>
            <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2px;">
              📅 ${escapeHtml(item.date)} | ⏰ ${escapeHtml(item.time)} | 📍 ${escapeHtml(item.location)}${noteStr}
            </div>
          </div>
          <div class="action-btns">
            ${item.type === '下班'
              ? `<button type="button" class="btn-action-icon record-edit-btn" data-row-index="${Number(item.rowIndex)}" data-note="${escapeHtml(safeNote)}" title="編輯備註">✏️</button>`
              : ''}
          </div>
        `;
        list.appendChild(li);
      });
    }

    let editingNoteRowIndex = null;

    // 前台編輯按鈕：只允許下班卡，使用事件委派避免 inline onclick 在部分瀏覽器/本機 HTML 環境失效
    document.getElementById('recordList').addEventListener('click', function(e) {

      // 下班紀錄的編輯按鈕維持原本功能，不觸發複製
      const editBtn = e.target.closest('.record-edit-btn');
      if (editBtn) {
        const rowIndex = Number(editBtn.dataset.rowIndex);
        const currentNote = editBtn.dataset.note || '';
        editNote(rowIndex, currentNote);
        return;
      }

      // 點整筆打卡紀錄，直接複製：姓名 日期 時間 地點 上/下
      const recordItem = e.target.closest('.record-item');
      if (!recordItem) return;

      const copyText = recordItem.dataset.copyText || '';
      if (!copyText) return;

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(copyText)
          .then(() => showToast('📋 已複製打卡紀錄'))
          .catch(() => fallbackCopyText(copyText));
      } else {
        fallbackCopyText(copyText);
      }
    });

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        const success = document.execCommand('copy');
        showToast(success ? '📋 已複製打卡紀錄' : '複製失敗，請重新操作');
      } catch (err) {
        showToast('複製失敗，請重新操作');
      }

      textarea.remove();
    }

    function editNote(rowIndex, currentNote) {
      const numericRowIndex = Number(rowIndex);
      if (!Number.isInteger(numericRowIndex) || numericRowIndex < 2) {
        alert('無法取得這筆打卡紀錄的資料列。請重新整理後再試一次。');
        return;
      }

      editingNoteRowIndex = numericRowIndex;

      const modal = document.getElementById('noteEditModal');
      const input = document.getElementById('editNoteInput');

      if (!modal || !input) {
        alert('編輯視窗載入失敗，請重新整理頁面。');
        return;
      }

      input.value = currentNote || '';
      modal.style.display = 'flex';

      setTimeout(() => {
        input.focus();
        input.select();
      }, 50);
    }

    function closeEditNoteModal() {
      editingNoteRowIndex = null;
      document.getElementById('noteEditModal').style.display = 'none';
    }

    function saveEditedNote() {
      if (editingNoteRowIndex === null) return;

      const rowIndex = editingNoteRowIndex;
      const newNote = document.getElementById('editNoteInput').value.trim();
      const saveBtn = document.getElementById('saveEditNoteBtn');

      saveBtn.disabled = true;
      saveBtn.innerText = '儲存中...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'updateNote',
          rowIndex: Number(rowIndex),
          note: newNote
        })
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          closeEditNoteModal();
          showToast('備註已更新');
          return fetchCloudData();
        }

        throw new Error(res.message || '未知錯誤');
      })
      .catch(err => {
        alert('備註更新失敗：' + (err.message || '請確認網路連線或後台更新功能。'));
      })
      .finally(() => {
        saveBtn.disabled = false;
        saveBtn.innerText = '儲存';
      });
    }

    document.getElementById('cancelEditNoteBtn').addEventListener('click', closeEditNoteModal);
    document.getElementById('saveEditNoteBtn').addEventListener('click', saveEditedNote);

    document.getElementById('noteEditModal').addEventListener('click', function(e) {
      if (e.target === this) closeEditNoteModal();
    });

    document.getElementById('editNoteInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveEditedNote();
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        closeEditNoteModal();
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function clearPendingAutoOff() {
      localStorage.removeItem('pending_off_timestamp');
      localStorage.removeItem('pending_off_name');
      if (autoOffTimer) {
        clearTimeout(autoOffTimer);
        autoOffTimer = null;
      }
    }

    function triggerAutoOffTimer(name) {
      clearPendingAutoOff();
      const delayMs = 40 * 60 * 1000;
      const targetTime = Date.now() + delayMs;
      localStorage.setItem('pending_off_name', name);
      localStorage.setItem('pending_off_timestamp', targetTime.toString());

      autoOffTimer = setTimeout(() => {
        sendAutoOffStatus(name);
      }, delayMs);
    }

    function checkPendingOffOnLoad() {
      const targetTimeStr = localStorage.getItem('pending_off_timestamp');
      const name = localStorage.getItem('pending_off_name');
      if (!targetTimeStr || !name) return;

      const targetTime = parseInt(targetTimeStr, 10);
      const remaining = targetTime - Date.now();

      if (remaining <= 0) {
        sendAutoOffStatus(name);
      } else {
        if (autoOffTimer) clearTimeout(autoOffTimer);
        autoOffTimer = setTimeout(() => {
          sendAutoOffStatus(name);
        }, remaining);
      }
    }

    function sendAutoOffStatus(name) {
      clearPendingAutoOff();

      const timeStr = getTaipeiTimeStr();
      const todayStr = getTaipeiDateStr();

      const payload = {
        name: name,
        type: '狀態',
        date: todayStr,
        time: timeStr,
        location: '',
        note: '',
        statusIsOn: false,
        statusMode: 'OFF'
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          showToast('⏳ 超過40分鐘，狀態已自動切換為 OFF');
          fetchCloudData();
        }
      })
      .catch(() => {});
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const location = document.getElementById('location').value.trim();

      // 上班中禁止再次打上班卡，必須先完成下班卡。
      if (selectedType === '上班' && isUserCurrentlyWorking(name)) {
        alert('您目前已在上班中，尚未打下班卡，無法再次打上班卡。');
        checkUserWorkingStatus();
        return;
      }
      const note = selectedType === '下班' ? document.getElementById('note').value.trim() : '';
      const timeStr = getTaipeiTimeStr();

      clearPendingAutoOff();

      const computedStatusIsOn = true;
      const computedStatusMode = selectedType === '上班' ? '上班中Working' : '⏳ 待確認 (Pending)';

      const payload = {
        name,
        type: selectedType,
        date: getTodayStr(),
        time: timeStr,
        location,
        note,
        statusIsOn: computedStatusIsOn,
        statusMode: computedStatusMode
      };

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '送出中...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          showToast('打卡成功！');
          
          if (selectedType === '上班') {
            const statusSelect = document.getElementById('statusSelect');
            const statusSubmitBtn = document.getElementById('statusSubmitBtn');
            const swOnBtn = document.getElementById('swOnBtn');
            const swOffBtn = document.getElementById('swOffBtn');

            showWorkingStatusLocked();
            swOnBtn.disabled = true;
            swOffBtn.disabled = true;
            statusSubmitBtn.disabled = true;
            statusSubmitBtn.innerText = '上班中已鎖定 (不可發送)';
            currentStatusState = 'ON';
            updateSwitchButtonStyles();

            cloudRecords.push({
              rowIndex: Number.MAX_SAFE_INTEGER,
              name: name,
              date: getTodayStr(),
              time: timeStr,
              location: location,
              type: '上班',
              note: '',
              statusIsOn: true,
              statusMode: '上班中Working'
            });
            if (latestStatusViewActive) renderLatestStatus();
          } else if (selectedType === '下班') {
            // 下班後由系統自動設定「⏳ 待確認」，員工不能手動選擇或送出此狀態。
            // 先把下班紀錄寫入本地暫存，避免雲端尚未刷新時又被誤判為「上班中」。
            const checkoutRecord = {
              rowIndex: Number.MAX_SAFE_INTEGER - 1,
              name: name,
              date: getTodayStr(),
              time: timeStr,
              location: location,
              type: '下班',
              note: note,
              statusIsOn: true,
              statusMode: '⏳ 待確認 (Pending)'
            };

            optimisticAttendanceRecords.push(checkoutRecord);
            cloudRecords = cloudRecords.filter(r =>
              !(String(r.name).toLowerCase() === name.toLowerCase() &&
                (r.type === '上班' || r.type === '下班'))
            );
            cloudRecords.push(checkoutRecord);

            triggerAutoOffTimer(name);
            renderRecords();
            if (latestStatusViewActive) renderLatestStatus();

            // 下班後狀態功能維持正常可操作，不鎖定 ON / OFF 或模式選擇。
            currentStatusState = 'ON';
            updateSwitchButtonStyles();
          }

          document.getElementById('checkinForm').reset();
          const currentName = localStorage.getItem('checkin_username') || '';
          if (currentName) {
            document.getElementById('userName').value = currentName;
            document.getElementById('statusUserName').value = currentName;
          }
          selectType('上班');
          setCurrentTimeDisplay();

          // 延後同步雲端，讓剛建立的下班紀錄先維持在前台狀態。
          // fetchCloudData 本身會保留尚未同步完成的暫存紀錄。
          setTimeout(() => fetchCloudData(), 800);
        } else {
          alert('打卡失敗：' + (res.message || '未知錯誤'));
        }
      })
      .catch(() => {
        alert('打卡失敗，請檢查網路連線。');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
        checkUserWorkingStatus();
      });
    });

    removePendingStatusOption();
    updateStatusSelectColor();
    initSavedUserName();
    initCalcDates();
    calculateTotalAmount();
    setCurrentTimeDisplay();
    updateSwitchButtonStyles();
    checkPendingOffOnLoad();
    fetchCloudData();
    setInterval(setCurrentTimeDisplay, 1000);
  </script>
</body>
</html>
