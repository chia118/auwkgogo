<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者後端 | 人員動態與紀錄管理</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #7d6e63;
      --primary-hover: #63564d;
      --bg: #f7f5f0;
      --card-bg: #ffffff;
      --border: #eae5df;
      --text: #4a403a;
      --muted: #9e938a;
    }

    * { box-sizing: border-box; word-break: break-word; }
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid var(--border); }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; color: var(--primary); margin: 0; }
    .btn-refresh { padding: 8px 14px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; }
    .btn-refresh:hover { background-color: var(--primary-hover); }

    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { padding: 10px 16px; background: none; border: none; color: var(--muted); font-size: 0.95rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .filter-panel { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; background: #faf9f7; padding: 12px; border-radius: 8px; border: 1px solid var(--border); align-items: center; }
    select, input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: #fff; font-size: 0.9rem; }
    .input-money { width: 75px; text-align: right; padding: 4px 6px; }

    .table-wrapper { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
    th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    th { background-color: #faf9f7; color: var(--primary); font-weight: 600; }
    
    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 500; }
    .tag-上班 { background-color: #e8f3ec; color: #3d7a5a; }
    .tag-下班 { background-color: #fbeee9; color: #b56247; }
    
    .status-badge { display: inline-flex; align-items: center; gap: 6px; color: #2d6a4f; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .mode-badge { display: inline-block; padding: 4px 10px; background-color: #f2efe9; border: 1px solid var(--border); border-radius: 20px; font-size: 0.82rem; font-weight: 500; color: var(--primary); }

    .btn-action { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 500; }
    .btn-delete { background-color: #fbeee9; color: #b56247; padding: 4px 8px; font-size: 0.8rem; }
    .btn-delete:hover { background-color: #f7d2c4; }
    .btn-add { background-color: var(--primary); color: white; }
    .btn-add:hover { background-color: var(--primary-hover); }
    .loading { text-align: center; color: var(--muted); padding: 24px 0; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 400px; }
    .modal-header { font-weight: 600; margin-bottom: 16px; color: var(--primary); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 4px; color: var(--muted); }
    .form-group input, .form-group select { width: 100%; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🛡️ 全員動態與後端管理控制台</h1>
      <button class="btn-refresh" onclick="loadAllData()">🔄 刷新資料</button>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('statusOnTab')">📱 人員狀態監控</button>
      <button class="tab-btn" onclick="switchTab('historyTab')">📋 個人打卡紀錄</button>
      <button class="tab-btn" onclick="switchTab('salaryTab')">💰 薪資計算</button>
    </div>

    <!-- 分頁一：人員狀態監控（僅顯示 ON 的人員） -->
    <div id="statusOnTab" class="tab-content active">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>狀態</th>
              <th>最後打卡時間</th>
              <th>上班地點</th>
              <th>選擇模式</th>
            </tr>
          </thead>
          <tbody id="statusOnTableBody">
            <tr><td colspan="5" class="loading">載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 分頁二：個人打卡紀錄 -->
    <div id="historyTab" class="tab-content">
      <div class="filter-panel">
        <input type="text" id="nameSearchInput" placeholder="🔍 請輸入姓名或關鍵字" oninput="renderHistory()">
        <select id="rangeFilter" onchange="renderHistory()">
          <option value="daily">當天 (Daily)</option>
          <option value="weekly">本週 (Weekly)</option>
          <option value="3months" selected>近三個月 (3 Months)</option>
        </select>
        <button class="btn-action btn-add" style="margin-left: auto;" onclick="openAddModal()">＋ 管理者補打卡</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>日期</th>
              <th>時間</th>
              <th>地點</th>
              <th>狀態</th>
              <th>備註 (下班同步)</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="7" class="loading">資料載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 分頁三：薪資計算 -->
    <div id="salaryTab" class="tab-content">
      <div class="filter-panel">
        <input type="text" id="salaryNameInput" placeholder="🔍 請輸入姓名或關鍵字">
        <span style="font-size:0.85rem; color:var(--muted);">開始：</span>
        <input type="date" id="salaryStartDate">
        <span style="font-size:0.85rem; color:var(--muted);">結束：</span>
        <input type="date" id="salaryEndDate">
        <button class="btn-action btn-add" onclick="calculateSalary()">🧮 計算薪資班表</button>
      </div>

      <div id="salaryResultArea" style="display: none;" class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>姓名</th>
              <th>日期</th>
              <th>上班時間</th>
              <th>下班時間</th>
              <th>地點</th>
              <th>自收 ($)</th>
              <th>車資 ($)</th>
              <th>時數</th>
              <th>下班備註同步</th>
            </tr>
          </thead>
          <tbody id="salaryTableBody"></tbody>
        </table>
      </div>

      <div id="salaryEmptyTip" class="loading">
        請輸入姓名與選擇日期範圍後點擊「計算薪資班表」
      </div>
    </div>
  </div>

  <!-- 管理者補打卡 Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">管理者手動新增/補打卡</div>
      <div class="form-group"><label>姓名</label><input type="text" id="modalName" placeholder="請輸入姓名"></div>
      <div class="form-group"><label>類別</label>
        <select id="modalType"><option value="上班">上班</option><option value="下班">下班</option></select>
      </div>
      <div class="form-group"><label>日期</label><input type="date" id="modalDate"></div>
      <div class="form-group"><label>時間</label><input type="time" id="modalTime" value="09:00"></div>
      <div class="form-group"><label>地點</label><input type="text" id="modalLocation" placeholder="例：OW、八度"></div>
      <div class="form-group"><label>備註</label><input type="text" id="modalNote" placeholder="選填（下班備註）"></div>
      <div class="modal-actions">
        <button class="btn-action" onclick="closeAddModal()">取消</button>
        <button class="btn-action btn-add" onclick="submitAddRecord()">新增打卡</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwzlYP6BXTkf0daiSRP3E6TnsmYyHZzmEHGQliBkII8pu2hA-mYrOIi2wBSZMBPLVKB3g/exec';
    let rawData = [];

    function formatDate(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      return str.split('T')[0].split(' ')[0];
    }

    function formatTime(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      return str.length > 5 ? str.substring(0, 5) : str;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      const idx = { 'statusOnTab': 0, 'historyTab': 1, 'salaryTab': 2 }[tabId];
      document.querySelectorAll('.tab-btn')[idx].classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function loadAllData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          if (res.result === 'success') {
            rawData = res.data.map((row, idx) => ({
              rowIndex: idx + 2,
              name: String(row[0] || '').trim(),
              date: formatDate(row[1]),
              time: formatTime(row[2]),
              location: String(row[3] || '').trim(),
              type: String(row[4] || '').trim(),
              note: String(row[5] || '').trim(),
              statusIsOn: row[6] !== undefined ? (row[6] === true || row[6] === 'TRUE' || row[6] === 'true') : true,
              statusMode: String(row[7] || '🥳 只嗨 (High Only)').trim()
            }));
            renderStatusOnUsers();
            renderHistory();
          }
        });
    }

    function renderStatusOnUsers() {
      const tbody = document.getElementById('statusOnTableBody');
      const userMap = {};

      // 找出每個人的最新紀錄以判斷狀態
      rawData.forEach(r => {
        if (!r.name) return;
        userMap[r.name] = r; // 因為依序讀取，後面的紀錄較新
      });

      const activeUsers = Object.values(userMap).filter(info => info.statusIsOn === true);

      if (activeUsers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">目前沒有開啓 ON 狀態的人員</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      activeUsers.forEach(info => {
        const tr = document.createElement('tr');
        let statusBadge = (info.type === '上班') 
          ? `<span class="status-badge"><span class="status-dot"></span> 上班中</span>` 
          : `<span class="status-badge" style="color:#7d6e63;"><span class="status-dot" style="background:#7d6e63;"></span> 在線 ON</span>`;
        
        let locationDisplay = (info.type === '上班' && info.location) ? `📍 ${info.location}` : '-';

        tr.innerHTML = `
          <td><strong>${info.name}</strong></td>
          <td>${statusBadge}</td>
          <td>${info.time || '-'}</td>
          <td>${locationDisplay}</td>
          <td><span class="mode-badge">${info.statusMode}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderHistory() {
      const tbody = document.getElementById('historyTableBody');
      const keyword = document.getElementById('nameSearchInput').value.trim().toLowerCase();
      const range = document.getElementById('rangeFilter').value;
      const todayStr = getTodayStr(), now = new Date();

      let filtered = rawData.filter(r => {
        if (keyword && !r.name.toLowerCase().includes(keyword)) return false;
        const rDate = new Date(r.date.replace(/-/g, '/'));
        if (range === 'daily') return r.date === todayStr;
        if (range === 'weekly') { const w = new Date(); w.setDate(now.getDate() - 7); return rDate >= w && rDate <= now; }
        if (range === '3months') { const m = new Date(); m.setDate(now.getDate() - 90); return rDate >= m && rDate <= now; }
        return true;
      });

      const displayList = [...filtered].reverse();
      if (displayList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="loading">查無符合條件的打卡紀錄</td></tr>';
        return;
      }

      tbody.innerHTML = '';
      displayList.forEach(item => {
        const tr = document.createElement('tr');
        // 需求：個人打卡紀錄備註同步「下班卡」的備註（若該筆為上班卡，其對應下班備註需從配對抓取，此處直接顯示該行備註若有，或保持空白）
        const noteDisplay = item.note || '';
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td>${item.date}</td>
          <td>${item.time}</td>
          <td>📍 ${item.location}</td>
          <td><span class="tag tag-${item.type}">${item.type}</span></td>
          <td>${noteDisplay}</td>
          <td><button class="btn-action btn-delete" onclick="deleteRecord(${item.rowIndex})">🗑️ 刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function calculateSalary() {
      const keyword = document.getElementById('salaryNameInput').value.trim().toLowerCase();
      const sDate = document.getElementById('salaryStartDate').value;
      const eDate = document.getElementById('salaryEndDate').value;
      const tbody = document.getElementById('salaryTableBody');

      if (!keyword || !sDate || !eDate) {
        alert('請完整輸入姓名關鍵字與日期區間！'); return;
      }

      let filtered = rawData.filter(r => r.name.toLowerCase().includes(keyword) && r.date >= sDate && r.date <= eDate);
      const groupMap = {};
      filtered.forEach(r => {
        const k = `${r.name}_${r.date}`;
        if (!groupMap[k]) groupMap[k] = [];
        groupMap[k].push(r);
      });

      const shiftList = [];
      Object.keys(groupMap).forEach(k => {
        let recs = groupMap[k];
        recs.sort((a, b) => a.time.localeCompare(b.time));
        let currentOn = null;

        recs.forEach(r => {
          if (r.type === '上班') currentOn = r;
          else if (r.type === '下班') {
            if (currentOn) {
              const hours = calcHours(currentOn.date, currentOn.time, r.date, r.time);
              // 需求：薪資計算的備註同步「下班卡」時的那個備註
              const offNote = r.note || '';
              shiftList.push({
                name: currentOn.name, date: currentOn.date,
                startTime: currentOn.time, endTime: r.time,
                location: currentOn.location || r.location || '-',
                selfCollect: parseSelfCollect(offNote), fare: 0, hours,
                note: offNote // 同步下班備註
              });
              currentOn = null;
            }
          }
        });
      });

      if (shiftList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="loading">無對應的完整班表紀錄</td></tr>';
      } else {
        tbody.innerHTML = '';
        shiftList.forEach(s => {
          tbody.innerHTML += `
            <tr>
              <td><strong>${s.name}</strong></td>
              <td>${s.date}</td>
              <td>${s.startTime}</td>
              <td>${s.endTime}</td>
              <td>📍 ${s.location}</td>
              <td><input type="number" class="input-money" value="${s.selfCollect}"></td>
              <td><input type="number" class="input-money" value="${s.fare}"></td>
              <td><strong>${s.hours}</strong> hr</td>
              <td><strong>${s.note}</strong></td>
            </tr>
          `;
        });
      }
      document.getElementById('salaryEmptyTip').style.display = 'none';
      document.getElementById('salaryResultArea').style.display = 'block';
    }

    function calcHours(d1, t1, d2, t2) {
      try {
        const start = new Date(`${d1.replace(/-/g, '/')} ${t1}`);
        const end = new Date(`${d2.replace(/-/g, '/')} ${t2}`);
        let diff = end - start;
        if (diff < 0) diff += 24 * 3600 * 1000;
        return (diff / (1000 * 60 * 60)).toFixed(1);
      } catch (e) { return 0; }
    }

    function parseSelfCollect(note) {
      if (!note) return 0;
      const match = note.match(/(?:自收|現金)\s*[:：]?\s*(\d+)/);
      return match ? parseInt(match[1], 10) : 0;
    }

    function deleteRecord(rowIndex) {
      if (!confirm(`確定要刪除第 ${rowIndex} 列紀錄嗎？`)) return;
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', rowIndex })
      }).then(res => res.json()).then(() => loadAllData());
    }

    function openAddModal() { document.getElementById('modalDate').value = getTodayStr(); document.getElementById('addModal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }
    function submitAddRecord() {
      const payload = {
        name: document.getElementById('modalName').value.trim(),
        type: document.getElementById('modalType').value,
        date: document.getElementById('modalDate').value,
        time: document.getElementById('modalTime').value,
        location: document.getElementById('modalLocation').value.trim(),
        note: document.getElementById('modalNote').value.trim()
      };
      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(() => { closeAddModal(); loadAllData(); });
    }

    window.onload = () => {
      document.getElementById('salaryStartDate').value = getTodayStr();
      document.getElementById('salaryEndDate').value = getTodayStr();
      loadAllData();
    };
  </script>
</body>
</html>
