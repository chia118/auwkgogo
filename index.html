<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Check-in | 打卡系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --primary-color: #7d6e63;
      --primary-hover: #63564d;
      --text-main: #4a403a;
      --text-muted: #9e938a;
      --border-color: #eae5df;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
      --radius: 16px;
      --tag-work-bg: #e8f3ec;
      --tag-work-text: #3d7a5a;
      --tag-off-bg: #fbeee9;
      --tag-off-text: #b56247;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans TC', sans-serif; word-break: break-word; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      border: 1px solid var(--border-color);
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; font-weight: 500; color: var(--primary-color); margin-bottom: 4px; }
    .header p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .header .date-display { font-size: 0.9rem; font-weight: 500; color: var(--primary-color); margin-top: 4px; }

    .nav-tabs { display: flex; border-bottom: 1px solid var(--border-color); margin-bottom: 24px; }
    .tab-btn {
      flex: 1; padding: 12px 0; background: none; border: none; color: var(--text-muted);
      font-size: 0.85rem; font-weight: 500; cursor: pointer; position: relative; transition: color 0.2s;
    }
    .tab-btn span.en { display: block; font-size: 0.7rem; font-weight: 400; opacity: 0.8; }
    .tab-btn.active { color: var(--primary-color); }
    .tab-btn.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background-color: var(--primary-color);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; min-width: 0; }
    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; min-width: 0; }

    label { display: block; font-size: 0.85rem; color: var(--primary-color); margin-bottom: 6px; font-weight: 500; }
    label .en { font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-left: 4px; }

    input, select {
      width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px;
      background-color: #faf9f7; color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary-color); background-color: #ffffff; }

    .time-select-group { display: flex; gap: 8px; }
    .time-select-group select { flex: 1; min-width: 0; }

    .type-toggle-group { display: flex; gap: 10px; }
    .type-btn {
      flex: 1; padding: 10px 8px; border: 1px solid var(--border-color); background-color: #faf9f7;
      color: var(--text-muted); border-radius: 8px; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-align: center;
    }
    .type-btn .en { display: block; font-size: 0.75rem; font-weight: 400; }
    .type-btn.active[data-type="上班"] { background-color: var(--tag-work-bg); color: var(--tag-work-text); border-color: var(--tag-work-text); }
    .type-btn.active[data-type="下班"] { background-color: var(--tag-off-bg); color: var(--tag-off-text); border-color: var(--tag-off-text); }

    .btn-submit {
      width: 100%; padding: 12px; background-color: var(--primary-color); color: #ffffff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background 0.2s;
    }
    .btn-submit .en { display: block; font-size: 0.8rem; opacity: 0.85; }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }

    .contact-notice { background-color: #f2efe9; color: var(--primary-color); font-size: 0.8rem; text-align: center; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border-color); }

    .filter-group { display: flex; gap: 4px; margin-bottom: 16px; }
    .filter-btn {
      flex: 1; padding: 6px 2px; background-color: #faf9f7; border: 1px solid var(--border-color);
      border-radius: 6px; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; text-align: center;
    }
    .filter-btn .en { display: block; font-size: 0.68rem; opacity: 0.85; }
    .filter-btn.active { background-color: var(--primary-color); color: #ffffff; border-color: var(--primary-color); }

    .btn-export {
      width: 100%; padding: 10px; background-color: #faf9f7; border: 1px dashed var(--primary-color);
      color: var(--primary-color); border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; margin-bottom: 16px; display: flex; justify-content: center; gap: 6px;
    }

    .calc-panel { background-color: #f5f2ec; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .calc-panel h3 { font-size: 0.95rem; color: var(--primary-color); margin-bottom: 12px; font-weight: 600; }
    .calc-panel input { padding: 8px 6px; font-size: 0.8rem; background-color: #ffffff; }
    .rule-tip { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }
    .result-box { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .result-box strong { font-size: 1.35rem; color: #3d7a5a; }

    .record-list { list-style: none; max-height: 280px; overflow-y: auto; }
    .record-item {
      padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px;
      background-color: #faf9f7; display: flex; justify-content: space-between; align-items: center;
    }
    .record-info { font-size: 0.85rem; line-height: 1.5; flex-grow: 1; }
    .record-info strong { color: var(--primary-color); font-weight: 500; }

    .action-btns { display: flex; gap: 4px; align-items: center; }
    .btn-action-icon { background: none; border: none; font-size: 0.9rem; padding: 4px 6px; cursor: pointer; border-radius: 4px; }
    .btn-edit:hover { background-color: #e2e8f0; color: #2563eb; }
    .btn-delete:hover { color: var(--tag-off-text); background-color: var(--tag-off-bg); }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; margin-left: 6px; }
    .tag-上班 { background-color: var(--tag-work-bg); color: var(--tag-work-text); }
    .tag-下班 { background-color: var(--tag-off-bg); color: var(--tag-off-text); }
    .empty-msg { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 24px 0; }

    .status-panel { background-color: #faf9f7; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    .status-toggle-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px dashed var(--border-color); }
    .switch-btn-group { display: flex; gap: 6px; }
    .sw-btn { padding: 8px 16px; border: 1px solid var(--border-color); background-color: #ffffff; color: var(--text-muted); border-radius: 8px; font-weight: 600; cursor: pointer; }
    .sw-btn.active-on { background-color: #e8f3ec; color: #3d7a5a; border-color: #3d7a5a; }
    .sw-btn.active-off { background-color: #fbeee9; color: #b56247; border-color: #b56247; }
    .status-preview { margin-top: 20px; padding: 16px; background: #ffffff; border-radius: 8px; border: 1px solid var(--border-color); text-align: center; }
    .status-preview-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; }
    .status-preview-val { font-size: 1.1rem; font-weight: 600; color: var(--primary-color); }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: rgba(74, 64, 58, 0.9);
      color: #ffffff; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>DAILY CHECK-IN</h1>
      <p>打卡系統 <span style="font-size: 0.8rem; opacity: 0.8;">/ Attendance System</span></p>
      <div id="todayDate" class="date-display"></div>
    </div>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('checkin')">新增打卡<span class="en">New Check-in</span></button>
      <button class="tab-btn" onclick="switchTab('records')">打卡紀錄<span class="en">Records</span></button>
      <button class="tab-btn" onclick="switchTab('status')">目前狀態<span class="en">Status</span></button>
    </div>

    <!-- 分頁一：新增打卡 -->
    <div id="checkinTab" class="tab-content active">
      <form id="checkinForm">
        <div class="form-group">
          <label for="userName">姓名 <span class="en">Name</span> *</label>
          <input type="text" id="userName" placeholder="請輸入姓名" required oninput="checkUserWorkingStatus()">
        </div>

        <div class="form-group">
          <label>打卡類別 <span class="en">Category</span> *</label>
          <div class="type-toggle-group">
            <button type="button" class="type-btn active" data-type="上班" onclick="selectType('上班')">上班<span class="en">Check-in</span></button>
            <button type="button" class="type-btn" data-type="下班" onclick="selectType('下班')">下班<span class="en">Check-out</span></button>
          </div>
        </div>

        <div class="form-group">
          <label>時間 <span class="en">Time</span> *</label>
          <div class="time-select-group">
            <select id="hour"></select>
            <select id="minute"></select>
          </div>
        </div>

        <div class="form-group">
          <label for="location">地點 <span class="en">Location</span> *</label>
          <input type="text" id="location" placeholder="OW、八度、飛龍" required>
        </div>

        <div id="offWorkFields" style="display: none;">
          <div class="form-group">
            <label for="note">備註 <span class="en">Note</span></label>
            <input type="text" id="note" placeholder="自收、客人算xx小、未收車資">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          完成打卡
          <span class="en">Submit Check-in</span>
        </button>
      </form>
    </div>

    <!-- 分頁二：打卡紀錄 -->
    <div id="recordsTab" class="tab-content">
      <div class="contact-notice">💡 點擊備註旁的 ✏️ 即可直接修改編輯備註</div>

      <div class="filter-group">
        <button class="filter-btn active" onclick="setFilter('daily', this)">每日<span class="en">Daily</span></button>
        <button class="filter-btn" onclick="setFilter('weekly', this)">本週<span class="en">Weekly</span></button>
        <button class="filter-btn" onclick="setFilter('3months', this)">近三個月<span class="en">3 Months</span></button>
        <button class="filter-btn" onclick="setFilter('calc', this)">時數查詢<span class="en">Calculator</span></button>
      </div>

      <button id="btnExport" class="btn-export" onclick="exportFilteredRecords()">📥 匯出當前紀錄 (Export CSV)</button>

      <div id="calcPanel" class="calc-panel" style="display: none;">
        <h3>🧮 計算機 <span class="en">/ Hours Calculator</span></h3>
        <div class="form-row">
          <div class="form-group">
            <label>上班日期</label>
            <input type="date" id="calcStartDate" onchange="calculateTotalAmount()">
          </div>
          <div class="form-group">
            <label>上班時間</label>
            <input type="time" id="calcStartTime" value="23:00" onchange="calculateTotalAmount()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>下班日期</label>
            <input type="date" id="calcEndDate" onchange="calculateTotalAmount()">
          </div>
          <div class="form-group">
            <label>下班時間</label>
            <input type="time" id="calcEndTime" value="02:00" onchange="calculateTotalAmount()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>時薪 ($)</label>
            <input type="number" id="calcRate" value="140" oninput="calculateTotalAmount()">
            <div class="rule-tip">>=15m = +0.5h, >=45m = +1h</div>
          </div>
          <div class="form-group">
            <label>車資 ($)</label>
            <input type="number" id="calcFare" value="0" oninput="calculateTotalAmount()">
          </div>
        </div>
        <div class="result-box">
          <label>計算結果 (<span id="calculatedHoursText">0</span> 小時)：</label>
          <strong id="calcResult">$0</strong>
        </div>
      </div>

      <ul id="recordList" class="record-list"></ul>
    </div>

    <!-- 分頁三：目前狀態 -->
    <div id="statusTab" class="tab-content">
      <div class="status-panel">
        <div class="status-toggle-box">
          <label>狀態開關 <span class="en">Status Switch</span></label>
          <div class="switch-btn-group">
            <button type="button" id="swOnBtn" class="sw-btn active-on" onclick="toggleStatusSwitch(true)">ON</button>
            <button type="button" id="swOffBtn" class="sw-btn" onclick="toggleStatusSwitch(false)">OFF</button>
          </div>
        </div>

        <div id="statusSelectGroup" class="form-group">
          <label for="statusSelect">選擇狀態模式 <span class="en">Select Mode</span></label>
          <select id="statusSelect" onchange="saveStatusSettings()">
            <option value="🥳 只嗨 (High Only)">🥳 只嗨 (High Only)</option>
            <option value="🍷 只酒 (Drinks Only)">🍷 只酒 (Drinks Only)</option>
            <option value="🎉 都可以 (Both)">🎉 都可以 (Both)</option>
          </select>
        </div>

        <div class="status-preview">
          <div class="status-preview-title">當前設定顯示效果 / Current Preview</div>
          <div id="statusPreviewVal" class="status-preview-val">🥳 只嗨 (High Only)</div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">操作成功</div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwzlYP6BXTkf0daiSRP3E6TnsmYyHZzmEHGQliBkII8pu2hA-mYrOIi2wBSZMBPLVKB3g/exec';

    let selectedType = '上班';
    let currentFilter = 'daily';
    let isStatusOn = true;
    let cloudRecords = [];

    function formatDate(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
      }
      return str.split('T')[0].split(' ')[0];
    }

    function formatTime(rawVal) {
      if (!rawVal) return '';
      const str = String(rawVal).trim();
      if (str.includes('T')) {
        const d = new Date(str);
        if (!isNaN(d.getTime())) {
          return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }
      }
      return str.length > 5 ? str.substring(0, 5) : str;
    }

    function getTodayStr() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function initDateDisplay() {
      const now = new Date();
      document.getElementById('todayDate').innerText = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      document.getElementById('calcStartDate').value = getTodayStr();
      const tomorrow = new Date(now);
      tomorrow.setDate(now.getDate() + 1);
      document.getElementById('calcEndDate').value = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      const todayDateEl = document.getElementById('todayDate');

      if (tabName === 'checkin') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('checkinTab').classList.add('active');
        todayDateEl.style.display = 'block';
      } else if (tabName === 'records') {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('recordsTab').classList.add('active');
        todayDateEl.style.display = 'none';
        fetchCloudData();
      } else if (tabName === 'status') {
        document.querySelectorAll('.tab-btn')[2].classList.add('active');
        document.getElementById('statusTab').classList.add('active');
        todayDateEl.style.display = 'none';
      }
    }

    function initTimeOptions() {
      const hSel = document.getElementById('hour'), mSel = document.getElementById('minute');
      hSel.innerHTML = ''; mSel.innerHTML = '';
      for (let i = 0; i < 24; i++) hSel.innerHTML += `<option value="${String(i).padStart(2, '0')}">${String(i).padStart(2, '0')} 時</option>`;
      for (let i = 0; i < 60; i++) mSel.innerHTML += `<option value="${String(i).padStart(2, '0')}">${String(i).padStart(2, '0')} 分</option>`;
      setNowTime();
    }

    function setNowTime() {
      const now = new Date();
      document.getElementById('hour').value = String(now.getHours()).padStart(2, '0');
      document.getElementById('minute').value = String(now.getMinutes()).padStart(2, '0');
    }

    function selectType(type) {
      selectedType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        if (btn.getAttribute('data-type') === type) btn.classList.add('active');
        else btn.classList.remove('active');
      });
      document.getElementById('offWorkFields').style.display = (type === '下班') ? 'block' : 'none';
      if (type !== '下班') document.getElementById('note').value = '';
      checkUserWorkingStatus();
    }

    // 防呆檢查：若已打上班卡尚未打下班卡，跳出提示並鎖定上班打卡
    function checkUserWorkingStatus() {
      const name = document.getElementById('userName').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      if (!name) return;

      const userRecords = cloudRecords.filter(r => r.name.toLowerCase() === name.toLowerCase());
      if (userRecords.length > 0) {
        userRecords.sort((a, b) => b.rowIndex - a.rowIndex);
        const lastRecord = userRecords[0];

        // 如果最新一筆是上班，且目前選的也是上班
        if (lastRecord.type === '上班' && selectedType === '上班') {
          submitBtn.disabled = true;
          submitBtn.innerText = '尚未打下班卡 (已鎖定)';
          return;
        }
      }
      submitBtn.disabled = false;
      submitBtn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
    }

    function fetchCloudData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          if (res.result === 'success') {
            cloudRecords = res.data.map((row, idx) => ({
              rowIndex: idx + 2,
              name: String(row[0] || '').trim(),
              date: formatDate(row[1]),
              time: formatTime(row[2]),
              location: String(row[3] || '').trim(),
              type: String(row[4] || '').trim(),
              note: String(row[5] || '').trim(),
              statusIsOn: row[6] !== undefined ? row[6] : true,
              statusMode: String(row[7] || '').trim()
            }));
            renderRecords();
            checkUserWorkingStatus();
          }
        })
        .catch(() => {});
    }

    function deleteRecord(rowIndex) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'delete', rowIndex: rowIndex })
        })
        .then(res => res.json())
        .then(res => {
          if (res.result === 'success') {
            showToast('紀錄已刪除');
            fetchCloudData();
          }
        });
      }
    }

    function editNote(rowIndex, currentNote) {
      const newNote = prompt("請輸入要修改的備註內容：", currentNote || "");
      if (newNote === null) return; // 取消

      const target = cloudRecords.find(r => r.rowIndex === rowIndex);
      if (!target) return;

      const payload = {
        action: 'updateNote',
        rowIndex: rowIndex,
        name: target.name,
        type: target.type,
        date: target.date,
        time: target.time,
        location: target.location,
        note: newNote.trim()
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'success') {
          showToast('備註已更新');
          fetchCloudData();
        } else {
          alert('更新失敗');
        }
      });
    }

    function toggleStatusSwitch(status) {
      isStatusOn = status;
      document.getElementById('swOnBtn').className = status ? 'sw-btn active-on' : 'sw-btn';
      document.getElementById('swOffBtn').className = status ? 'sw-btn' : 'sw-btn active-off';
      document.getElementById('statusSelectGroup').style.opacity = status ? '1' : '0.5';
      document.getElementById('statusSelectGroup').style.pointerEvents = status ? 'auto' : 'none';
      saveStatusSettings();
    }

    function saveStatusSettings() {
      const val = document.getElementById('statusSelect').value;
      const previewEl = document.getElementById('statusPreviewVal');
      previewEl.innerText = isStatusOn ? val : '🚫 已關閉狀態顯示 (OFF)';
      previewEl.style.color = isStatusOn ? 'var(--primary-color)' : 'var(--text-muted)';

      localStorage.setItem('user_status_config', JSON.stringify({ isOn: isStatusOn, value: val }));
      const name = document.getElementById('userName').value.trim();
      if (name) {
        fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            name, type: selectedType, date: getTodayStr(),
            time: `${document.getElementById('hour').value}:${document.getElementById('minute').value}`,
            location: document.getElementById('location').value.trim() || '未定',
            note: document.getElementById('note').value.trim(),
            statusIsOn: isStatusOn, statusMode: val
          })
        });
      }
    }

    function loadStatusSettings() {
      const config = JSON.parse(localStorage.getItem('user_status_config'));
      if (config) {
        isStatusOn = config.isOn;
        if (config.value) document.getElementById('statusSelect').value = config.value;
      }
      toggleStatusSwitch(isStatusOn);
    }

    function setFilter(filterType, btnElement) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      document.getElementById('calcPanel').style.display = (filterType === 'calc') ? 'block' : 'none';
      document.getElementById('btnExport').style.display = (filterType === 'calc') ? 'none' : 'flex';
      renderRecords();
    }

    function filterRecords(records) {
      const now = new Date(), todayStr = getTodayStr();
      return records.filter(item => {
        const rDate = new Date(item.date.replace(/-/g, '/'));
        if (currentFilter === 'daily') return item.date === todayStr;
        if (currentFilter === 'weekly') {
          const weekAgo = new Date(); weekAgo.setDate(now.getDate() - 7);
          return rDate >= weekAgo && rDate <= now;
        }
        if (currentFilter === '3months') {
          const mAgo = new Date(); mAgo.setDate(now.getDate() - 90);
          return rDate >= mAgo && rDate <= now;
        }
        return true;
      });
    }

    function calculateCrossDayHours(sDate, sTime, eDate, eTime) {
      const start = new Date(`${sDate.replace(/-/g, '/')} ${sTime}:00`);
      const end = new Date(`${eDate.replace(/-/g, '/')} ${eTime}:00`);
      let mins = Math.floor((end - start) / (1000 * 60));
      if (isNaN(mins) || mins <= 0) return 0;
      const full = Math.floor(mins / 60), rem = mins % 60;
      return full + (rem >= 45 ? 1.0 : (rem >= 15 ? 0.5 : 0));
    }

    function calculateTotalAmount() {
      const hours = calculateCrossDayHours(
        document.getElementById('calcStartDate').value, document.getElementById('calcStartTime').value,
        document.getElementById('calcEndDate').value, document.getElementById('calcEndTime').value
      );
      const rate = parseFloat(document.getElementById('calcRate').value) || 0;
      const fare = parseFloat(document.getElementById('calcFare').value) || 0;
      document.getElementById('calculatedHoursText').innerText = hours;
      document.getElementById('calcResult').innerText = `$${Math.round((hours * rate) + fare).toLocaleString()}`;
    }

    function exportFilteredRecords() {
      const filtered = filterRecords(cloudRecords);
      if (filtered.length === 0) { alert('目前無紀錄可供匯出！'); return; }
      let csv = "\uFEFF姓名,日期,類別,時間,地點,備註\n";
      filtered.forEach(i => {
        csv += `"${i.name}","${i.date}","${i.type}","${i.time}","${i.location}","${i.note}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `打卡紀錄_${getTodayStr()}.csv`;
      link.click();
    }

    function renderRecords() {
      const list = document.getElementById('recordList');
      list.innerHTML = '';
      if (currentFilter === 'calc') {
        list.style.display = 'none';
        const w = cloudRecords.find(r => r.type === '上班'), o = cloudRecords.find(r => r.type === '下班');
        if (w) { document.getElementById('calcStartDate').value = w.date; document.getElementById('calcStartTime').value = w.time; }
        if (o) { document.getElementById('calcEndDate').value = o.date; document.getElementById('calcEndTime').value = o.time; }
        calculateTotalAmount();
        return;
      }
      list.style.display = 'block';
      const filtered = filterRecords(cloudRecords).reverse();
      if (filtered.length === 0) {
        list.innerHTML = '<li class="empty-msg">尚無符合條件的紀錄</li>';
        return;
      }
      filtered.forEach(item => {
        const li = document.createElement('li');
        li.className = 'record-item';
        
        // 備註若無則不顯示，若有則顯示並支援編輯
        const noteStr = item.note ? `<br><span style="color:#7d6e63; font-size:0.78rem;">📝 ${item.note}</span>` : '';
        
        li.innerHTML = `
          <div class="record-info">
            <div><strong>${item.name}</strong> <span class="tag tag-${item.type}">${item.type}</span></div>
            <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2px;">📅 ${item.date} | ⏰ ${item.time} | 📍 ${item.location}${noteStr}</div>
          </div>
          <div class="action-btns">
            <button type="button" class="btn-action-icon btn-edit" onclick="editNote(${item.rowIndex}, '${item.note}')" title="編輯備註">✏️</button>
            <button type="button" class="btn-action-icon btn-delete" onclick="deleteRecord(${item.rowIndex})" title="刪除">✕</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('checkinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const location = document.getElementById('location').value.trim();
      const note = document.getElementById('note').value.trim();
      const timeStr = `${document.getElementById('hour').value}:${document.getElementById('minute').value}`;

      // 嚴格防呆：若已打上班卡尚未打下班卡，禁止再次上班
      const userRecords = cloudRecords.filter(r => r.name.toLowerCase() === name.toLowerCase());
      if (userRecords.length > 0) {
        userRecords.sort((a, b) => b.rowIndex - a.rowIndex);
        if (userRecords[0].type === '上班' && selectedType === '上班') {
          alert('您尚未打下班卡唷！');
          return;
        }
      }

      const payload = {
        name, type: selectedType, date: getTodayStr(), time: timeStr,
        location, note, statusIsOn: isStatusOn, statusMode: document.getElementById('statusSelect').value
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.innerText = '打卡中...';

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = '完成打卡<span class="en">Submit Check-in</span>';
        if (res.result === 'success') {
          alert('打卡完成！');
          document.getElementById('location').value = '';
          document.getElementById('note').value = '';
          setNowTime();
          switchTab('records');
        } else {
          alert('打卡失敗：' + res.message);
        }
      });
    });

    window.onload = () => { initDateDisplay(); initTimeOptions(); loadStatusSettings(); fetchCloudData(); };
  </script>
</body>
</html>
